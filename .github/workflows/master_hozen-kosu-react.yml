name: Deploy Django + React to Azure  
on:  
  push:  
    branches:  
      - master  
  workflow_dispatch:  
jobs:  
  build-and-deploy:  
    runs-on: ubuntu-latest  
    env:  
      SECRET_KEY: ${{ secrets.SECRET_KEY }}  
      DEBUG: ${{ secrets.DEBUG }}  
      DB_NAME: ${{ secrets.DB_NAME }}  
      DB_USER: ${{ secrets.DB_USER }}  
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}  
      DB_HOST: ${{ secrets.DB_HOST }}  
      HELP_PATH: ${{ secrets.HELP_PATH }}  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
      - name: Set up Python  
        uses: actions/setup-python@v5  
        with:  
          python-version: "3.12"  
      - name: Set up Node.js  
        uses: actions/setup-node@v4  
        with:  
          node-version: "20"  
      - name: Install React dependencies  
        run: |  
          cd frontend  
          npm install  
      - name: Build React  
        run: |  
          cd frontend  
          npm run build  
      - name: Install Python dependencies  
        run: |  
          python -m venv antenv  
          source antenv/bin/activate  
          pip install --upgrade pip  
          pip install -r requirements.txt  
      - name: Collect static files  
        run: |  
          source antenv/bin/activate  
          python manage.py collectstatic --noinput  
      - name: Create deployment zip  
        run: |  
          zip -r release.zip . -x ".git/*" "node_modules/*" "frontend/node_modules/*"  
      - name: Deploy to Azure Web App  
        uses: azure/webapps-deploy@v3  
        with:  
          app-name: hozen-kosu-React  
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_054C4F3FA5C14FFF913C35ACF9E2E28A }}  
          package: release.zip  